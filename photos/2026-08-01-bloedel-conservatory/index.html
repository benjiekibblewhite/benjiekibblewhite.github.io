    <script>
      let currentPhotoIndex = 0;
      const photos = [{"filename":"African Gray Parrot 2.jpg","title":"African Gray Parrot 2","imageId":"AfricanGrayParrot2_0","originalPath":"/photos/2026-08-01-bloedel-conservatory/African Gray Parrot 2.jpg","optimizedPath":"/static/optimized/2026-08-01-bloedel-conservatory/African Gray Parrot 2.webp"},{"filename":"African Gray Parrot.jpg","title":"African Gray Parrot","imageId":"AfricanGrayParrot_1","originalPath":"/photos/2026-08-01-bloedel-conservatory/African Gray Parrot.jpg","optimizedPath":"/static/optimized/2026-08-01-bloedel-conservatory/African Gray Parrot.webp"},{"filename":"Black-headed Weaver.jpg","title":"Black-headed Weaver","imageId":"Black-headedWeaver_2","originalPath":"/photos/2026-08-01-bloedel-conservatory/Black-headed Weaver.jpg","optimizedPath":"/static/optimized/2026-08-01-bloedel-conservatory/Black-headed Weaver.webp"},{"filename":"Red-fronted Macaw 2.jpg","title":"Red-fronted Macaw 2","imageId":"Red-frontedMacaw2_3","originalPath":"/photos/2026-08-01-bloedel-conservatory/Red-fronted Macaw 2.jpg","optimizedPath":"/static/optimized/2026-08-01-bloedel-conservatory/Red-fronted Macaw 2.webp"},{"filename":"Red-fronted Macaw.jpg","title":"Red-fronted Macaw","imageId":"Red-frontedMacaw_4","originalPath":"/photos/2026-08-01-bloedel-conservatory/Red-fronted Macaw.jpg","optimizedPath":"/static/optimized/2026-08-01-bloedel-conservatory/Red-fronted Macaw.webp"},{"filename":"Scarlet Macaw.jpg","title":"Scarlet Macaw","imageId":"ScarletMacaw_5","originalPath":"/photos/2026-08-01-bloedel-conservatory/Scarlet Macaw.jpg","optimizedPath":"/static/optimized/2026-08-01-bloedel-conservatory/Scarlet Macaw.webp"},{"filename":"Sulphur Crested Cockatoo 2.jpg","title":"Sulphur Crested Cockatoo 2","imageId":"SulphurCrestedCockatoo2_6","originalPath":"/photos/2026-08-01-bloedel-conservatory/Sulphur Crested Cockatoo 2.jpg","optimizedPath":"/static/optimized/2026-08-01-bloedel-conservatory/Sulphur Crested Cockatoo 2.webp"},{"filename":"Sulphur Crested Cockatoo.jpg","title":"Sulphur Crested Cockatoo","imageId":"SulphurCrestedCockatoo_7","originalPath":"/photos/2026-08-01-bloedel-conservatory/Sulphur Crested Cockatoo.jpg","optimizedPath":"/static/optimized/2026-08-01-bloedel-conservatory/Sulphur Crested Cockatoo.webp"},{"filename":"Umbrella Cocktaoo.jpg","title":"Umbrella Cocktaoo","imageId":"UmbrellaCocktaoo_8","originalPath":"/photos/2026-08-01-bloedel-conservatory/Umbrella Cocktaoo.jpg","optimizedPath":"/static/optimized/2026-08-01-bloedel-conservatory/Umbrella Cocktaoo.webp"},{"filename":"Yellow-headed Amazon.jpg","title":"Yellow-headed Amazon","imageId":"Yellow-headedAmazon_9","originalPath":"/photos/2026-08-01-bloedel-conservatory/Yellow-headed Amazon.jpg","optimizedPath":"/static/optimized/2026-08-01-bloedel-conservatory/Yellow-headed Amazon.webp"},{"filename":"Zebra Finch.jpg","title":"Zebra Finch","imageId":"ZebraFinch_10","originalPath":"/photos/2026-08-01-bloedel-conservatory/Zebra Finch.jpg","optimizedPath":"/static/optimized/2026-08-01-bloedel-conservatory/Zebra Finch.webp"}];
      
   
      
      // Get imageId from query parameter
      function getImageIdFromQuery() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('openImage');
      }
      
      // Find photo index by imageId
      function findPhotoIndexByImageId(imageId) {
        for (let i = 0; i < photos.length; i++) {
          if (photos[i].imageId === imageId) {
            return i;
          }
        }
        return -1;
      }
      
      function openModal(index) {
        currentPhotoIndex = index;
        updateModal();
        document.getElementById('photoModal').classList.add('active');
        document.body.style.overflow = 'hidden';
        
        // Set query parameter
        const imageId = photos[index].imageId
        const url = new URL(window.location);
        url.searchParams.set('openImage', imageId);
        window.history.pushState({}, '', url);
      }
      
      function closeModal() {
        document.getElementById('photoModal').classList.remove('active');
        document.body.style.overflow = 'auto';
        
        // Remove query parameter
        const url = new URL(window.location);
        url.searchParams.delete('openImage');
        window.history.pushState({}, '', url);
      }
      
      function updateModal() {
        const photo = photos[currentPhotoIndex];
        document.getElementById('modalImage').src = photo.optimizedPath;
        document.getElementById('modalImage').alt = photo.title;
        document.getElementById('modalFilename').textContent = photo.title;
        // document.getElementById('modalOriginalLink').href = photo.originalPath;
        
        // Update navigation button visibility
        const prevBtn = document.querySelector('.modal-prev');
        const nextBtn = document.querySelector('.modal-next');
        
        prevBtn.style.display = photos.length > 1 ? 'flex' : 'none';
        nextBtn.style.display = photos.length > 1 ? 'flex' : 'none';
      }
      
      function previousPhoto() {
        if (photos.length <= 1) return;
        currentPhotoIndex = (currentPhotoIndex - 1 + photos.length) % photos.length;
        updateModal();
        
        // Update query parameter
        const imageId = photos[currentPhotoIndex].imageId;
        const url = new URL(window.location);
        url.searchParams.set('openImage', imageId);
        window.history.pushState({}, '', url);
      }
      
      function nextPhoto() {
        if (photos.length <= 1) return;
        currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
        updateModal();
        
        // Update query parameter
        const imageId = photos[currentPhotoIndex].imageId;
        const url = new URL(window.location);
        url.searchParams.set('openImage', imageId);
        window.history.pushState({}, '', url);
      }
      
      // Keyboard navigation
      document.addEventListener('keydown', function(e) {
        const modal = document.getElementById('photoModal');
        if (!modal.classList.contains('active')) return;
        
        switch(e.key) {
          case 'Escape':
            closeModal();
            break;
          case 'ArrowLeft':
            previousPhoto();
            break;
          case 'ArrowRight':
            nextPhoto();
            break;
        }
      });
      
      // Close modal when clicking outside
      document.getElementById('photoModal').addEventListener('click', function(e) {
        if (e.target === this) {
          closeModal();
        }
      });
      
      // Check for openImage query parameter on page load
      document.addEventListener('DOMContentLoaded', function() {
        const imageId = getImageIdFromQuery();
        if (imageId) {
          const photoIndex = findPhotoIndexByImageId(imageId);
          if (photoIndex !== -1) {
            openModal(photoIndex);
          }
        }
      });
      
      // Handle browser back/forward button navigation
      window.addEventListener('popstate', function() {
        const imageId = getImageIdFromQuery();
        if (imageId) {
          const photoIndex = findPhotoIndexByImageId(imageId);
          if (photoIndex !== -1) {
            currentPhotoIndex = photoIndex;
            updateModal();
            document.getElementById('photoModal').classList.add('active');
            document.body.style.overflow = 'hidden';
          }
        } else {
          // No imageId in URL, close modal if open
          if (document.getElementById('photoModal').classList.contains('active')) {
            document.getElementById('photoModal').classList.remove('active');
            document.body.style.overflow = 'auto';
          }
        }
      });
    </script>
