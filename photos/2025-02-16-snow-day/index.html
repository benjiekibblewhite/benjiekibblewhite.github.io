    <main id="main-content">

</div>

        <div class="gallery-photos">
          <div class="photo-grid">
            
      <button type="button" class="photo-item" aria-label="View photo: bush" onclick="openModal(0)">

      <button type="button" class="photo-item" aria-label="View photo: cone" onclick="openModal(1)">

      <button type="button" class="photo-item" aria-label="View photo: street" onclick="openModal(2)">

      <button type="button" class="photo-item" aria-label="View photo: thistle" onclick="openModal(3)">

    <!-- Modal -->
    <div id="photoModal" class="modal" role="dialog" aria-modal="true" aria-label="Photo viewer">
      <div class="modal-content">
        <button aria-label="Close photo viewer" class="modal-close" onclick="closeModal()"><svg xmlns="http://www.w3.org/2000/svg" height="36px" viewBox="0 -960 960 960" width="36px" fill="#e3e3e3"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg></button>
        <button aria-label="View previous image" class="modal-controls modal-prev" onclick="previousPhoto()"><svg xmlns="http://www.w3.org/2000/svg" height="36px" viewBox="0 -960 960 960" width="36px" fill="#e3e3e3"><path d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z"/></svg></button>
        <img id="modalImage" src="" alt="">
        <button aria-label="View next image" class="modal-controls modal-next" onclick="nextPhoto()"><svg xmlns="http://www.w3.org/2000/svg" height="36px" viewBox="0 -960 960 960" width="36px" fill="#e3e3e3"><path d="M504-480 320-664l56-56 240 240-240 240-56-56 184-184Z"/></svg></button>
        <div class="modal-info" aria-live="polite">
          <div class="modal-filename" id="modalFilename"></div>
          <div class="modal-counter" id="modalCounter"></div>
        </div>
      </div>
    </div>
    
    <script>
      let currentPhotoIndex = 0;
      let previouslyFocusedElement = null;
      let modalPushedHistory = false; // did openModal push a history entry?
      const photos = [{"filename":"bush.jpg","title":"bush","imageId":"bush_0","originalPath":"/photos/2025-02-16-snow-day/bush.jpg","optimizedPath":"/static/optimized/2025-02-16-snow-day/bush.webp"},{"filename":"cone.jpg","title":"cone","imageId":"cone_1","originalPath":"/photos/2025-02-16-snow-day/cone.jpg","optimizedPath":"/static/optimized/2025-02-16-snow-day/cone.webp"},{"filename":"street.jpg","title":"street","imageId":"street_2","originalPath":"/photos/2025-02-16-snow-day/street.jpg","optimizedPath":"/static/optimized/2025-02-16-snow-day/street.webp"},{"filename":"thistle.jpg","title":"thistle","imageId":"thistle_3","originalPath":"/photos/2025-02-16-snow-day/thistle.jpg","optimizedPath":"/static/optimized/2025-02-16-snow-day/thistle.webp"}];
      
   
      
      // Get imageId from query parameter
      function getImageIdFromQuery() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('openImage');
      }
      
      // Find photo index by imageId
      function findPhotoIndexByImageId(imageId) {
        for (let i = 0; i < photos.length; i++) {
          if (photos[i].imageId === imageId) {
            return i;
          }
        }
        return -1;
      }
      
      function openModal(index, push) {
        if (push === undefined) push = true;
        currentPhotoIndex = index;
        previouslyFocusedElement = document.activeElement;
        updateModal();
        document.getElementById('photoModal').classList.add('active');
        document.body.style.overflow = 'hidden';

        // Make the page behind the dialog inert
        const header = document.querySelector('header');
        const main = document.querySelector('main');
        if (header) header.inert = true;
        if (main) main.inert = true;

        // Move focus into the dialog
        document.querySelector('.modal-close').focus();

        // Set query parameter. Only push when the user opened the viewer
        // (a deep-linked load already has the right URL — don't stack entries)
        if (push) {
          const imageId = photos[index].imageId
          const url = new URL(window.location);
          url.searchParams.set('openImage', imageId);
          window.history.pushState({}, '', url);
          modalPushedHistory = true;
        }
      }

      function closeModal() {
        // If we pushed an entry on open, consume it — popstate runs the
        // close path, so Back after closing no longer resurrects the viewer
        if (modalPushedHistory) {
          modalPushedHistory = false;
          history.back();
          return;
        }

        closeModalUI();

        // Remove query parameter without adding history
        const url = new URL(window.location);
        url.searchParams.delete('openImage');
        window.history.replaceState({}, '', url);
      }

      function closeModalUI() {
        document.getElementById('photoModal').classList.remove('active');
        document.body.style.overflow = 'auto';

        // Restore the background page
        const header = document.querySelector('header');
        const main = document.querySelector('main');
        if (header) header.inert = false;
        if (main) main.inert = false;

        // Return focus to the element that opened the dialog
        if (previouslyFocusedElement) {
          previouslyFocusedElement.focus();
          previouslyFocusedElement = null;
        }
      }
      
      function updateModal() {
        const photo = photos[currentPhotoIndex];
        document.getElementById('modalImage').src = photo.optimizedPath;
        // alt stays empty: the visible filename caption below labels the image
        document.getElementById('modalFilename').textContent = photo.title;
        document.getElementById('modalCounter').textContent = (currentPhotoIndex + 1) + ' of ' + photos.length;
        // document.getElementById('modalOriginalLink').href = photo.originalPath;
        
        // Update navigation button visibility
        const prevBtn = document.querySelector('.modal-prev');
        const nextBtn = document.querySelector('.modal-next');
        
        prevBtn.style.display = photos.length > 1 ? 'flex' : 'none';
        nextBtn.style.display = photos.length > 1 ? 'flex' : 'none';
      }
      
      function previousPhoto() {
        if (photos.length <= 1) return;
        currentPhotoIndex = (currentPhotoIndex - 1 + photos.length) % photos.length;
        updateModal();

        // Update query parameter (replaceState: one history entry per modal
        // session, so Back doesn't step through every photo)
        const imageId = photos[currentPhotoIndex].imageId;
        const url = new URL(window.location);
        url.searchParams.set('openImage', imageId);
        window.history.replaceState({}, '', url);
      }
      
      function nextPhoto() {
        if (photos.length <= 1) return;
        currentPhotoIndex = (currentPhotoIndex + 1) % photos.length;
        updateModal();

        // Update query parameter (replaceState: one history entry per modal
        // session, so Back doesn't step through every photo)
        const imageId = photos[currentPhotoIndex].imageId;
        const url = new URL(window.location);
        url.searchParams.set('openImage', imageId);
        window.history.replaceState({}, '', url);
      }
      
      // Keyboard navigation
      document.addEventListener('keydown', function(e) {
        const modal = document.getElementById('photoModal');
        if (!modal.classList.contains('active')) return;

        // Trap Tab within the dialog
        if (e.key === 'Tab') {
          // NOTE: filter on computed display, not offsetParent — offsetParent
          // is always null for position:fixed elements (these buttons)
          const focusable = Array.from(modal.querySelectorAll('button')).filter(
            (btn) => getComputedStyle(btn).display !== 'none'
          );
          if (focusable.length === 0) return;
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          } else if (!modal.contains(document.activeElement)) {
            e.preventDefault();
            first.focus();
          }
          return;
        }

        switch(e.key) {
          case 'Escape':
            closeModal();
            break;
          case 'ArrowLeft':
            previousPhoto();
            break;
          case 'ArrowRight':
            nextPhoto();
            break;
        }
      });
      
      // Close modal when clicking outside
      document.getElementById('photoModal').addEventListener('click', function(e) {
        if (e.target === this) {
          closeModal();
        }
      });
      
      // Check for openImage query parameter on page load
      document.addEventListener('DOMContentLoaded', function() {
        const imageId = getImageIdFromQuery();
        if (imageId) {
          const photoIndex = findPhotoIndexByImageId(imageId);
          if (photoIndex !== -1) {
            openModal(photoIndex, false); // URL already correct, don't push
          }
        }
      });
      
      // Handle browser back/forward button navigation
      window.addEventListener('popstate', function() {
        const imageId = getImageIdFromQuery();
        if (imageId) {
          const photoIndex = findPhotoIndexByImageId(imageId);
          if (photoIndex !== -1) {
            // Reopened via browser history: restore focus into the dialog and
            // remember the matching grid button for focus return
            previouslyFocusedElement =
              document.querySelectorAll('.photo-item')[photoIndex] || null;
            currentPhotoIndex = photoIndex;
            updateModal();
            document.getElementById('photoModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            const header = document.querySelector('header');
            const main = document.querySelector('main');
            if (header) header.inert = true;
            if (main) main.inert = true;
            document.querySelector('.modal-close').focus();
          }
        } else {
          // No imageId in URL, close modal if open
          if (document.getElementById('photoModal').classList.contains('active')) {
            modalPushedHistory = false;
            closeModalUI();
          }
        }
      });
    </script>
